name: Generate Stats Cards

on:
  # run automatically once a day (off-peak minute to avoid cron congestion)
  schedule:
    - cron: "23 3 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # generates the GitHub stats card as a local SVG, no external service needed
      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: "username=flesymeb&show_icons=true&hide_border=true&theme=tokyonight"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # generates the WakaTime card as a local SVG
      - name: Generate wakatime card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: wakatime
          options: "username=hyoung&hide_border=true&layout=compact&langs_count=6&theme=tokyonight"
          path: profile/wakatime.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git commit -m "chore: update readme stats cards" || echo "No changes to commit"
          git push
