name: Generate Stats Cards

on:
  # run automatically once a day (off-peak minute to avoid cron congestion)
  schedule:
    - cron: "23 3 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # stats 卡需要 PAT_1 secret（classic PAT，勾选 read:user 即可）：
      # 未配置时会回退到 GITHUB_TOKEN，GraphQL 查询用户数据会失败，
      # 生成的错误卡会在下方提交步骤被自动丢弃，不会覆盖已有好卡片。
      # 创建入口: Settings -> Developer settings -> Personal access tokens
      # 然后: gh secret set PAT_1 -R Flesymeb/flesymeb
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: stats
          options: "username=flesymeb&show_icons=true&hide_border=true&card_width=520&theme=tokyonight"
          path: profile/stats.svg
          token: ${{ secrets.PAT_1 }}

      # wakatime 卡读取公开数据，GITHUB_TOKEN 就够
      # card_width=440：与 stats 卡同比例（2.667），两卡行总宽与图表行一致
      - name: Generate wakatime card
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: wakatime
          options: "username=hyoung&hide_border=true&layout=compact&langs_count=6&card_width=440&theme=tokyonight"
          path: profile/wakatime.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 活动图表（rogue 主题复刻版），贡献日历数据 GITHUB_TOKEN 可读
      - name: Generate activity graph
        env:
          GH_TOKEN: ${{ secrets.PAT_1 || secrets.GITHUB_TOKEN }}
        run: python scripts/activity_graph.py --username flesymeb --out profile/activity-graph.svg

      - name: Commit and push
        run: |
          # 丢弃生成失败的卡片，避免覆盖仓库里已有的好版本
          for f in profile/stats.svg profile/wakatime.svg; do
            if [ -f "$f" ] && grep -q "Something went wrong" "$f"; then
              echo "::warning::$f 生成失败（多半是 PAT_1 未配置），保留旧版本"
              git checkout -- "$f" 2>/dev/null || rm -f "$f"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git commit -m "chore: update readme stats cards" || echo "No changes to commit"
          git push
